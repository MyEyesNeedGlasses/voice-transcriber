<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice Transcriber</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <main>
    <header>
      <h1>Voice Transcriber</h1>
      <p class="muted">Record your voice, then transcribe it with WhisperX.</p>
    </header>

    <section class="card">
      <div class="recorder">
        <button id="record-btn" class="btn btn-record" type="button">
          <span class="dot"></span><span id="record-label">Start recording</span>
        </button>
        <span id="timer" class="timer">00:00</span>
      </div>

      <audio id="preview" controls hidden></audio>

      <div class="actions">
        <button id="transcribe-btn" class="btn btn-primary" type="button" disabled>Transcribe</button>
        <label class="btn btn-ghost">
          Upload a file
          <input id="file-input" type="file" accept="audio/*,video/webm" hidden>
        </label>
        <label id="speakers-field" class="field" hidden>
          Speakers
          <input id="speakers-input" type="number" min="1" max="20" placeholder="auto">
        </label>
      </div>

      <p id="status" class="status" role="status"></p>
    </section>

    <section id="result-card" class="card" hidden>
      <div class="card-head">
        <h2>Transcript</h2>
        <button id="copy-btn" class="btn btn-ghost btn-small" type="button">Copy</button>
      </div>
      <p id="result-meta" class="muted small"></p>
      <p id="result-text" class="transcript"></p>
      <div id="result-turns" class="turns" hidden></div>
    </section>

    <section class="card">
      <h2>History</h2>
      <ul id="history" class="history"></ul>
      <p id="history-empty" class="muted small">No transcriptions yet.</p>
    </section>
  </main>

  <script src="{{ url_for('static', path='app.js') }}"></script>
</body>
</html>
